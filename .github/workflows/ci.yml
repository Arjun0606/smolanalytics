name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./internal ./cmd)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race)
        run: go test -race ./...

      # sdk.js ships to every customer's browser and its env detection decides whether an
      # event counts as production at all. Go tests cannot reach it, so it gets its own runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: sdk env detection
        run: node internal/api/sdktest/env.test.mjs

      # mcp-publish.yml publishes this file on every tag, and the registry rejects it after the tag
      # exists — v0.92.0 422'd on a description over the schema's 100-character cap, silently, in a
      # workflow nobody watches. The two limits that can be hit by editing prose are checked here.
      - name: server.json fits the registry schema
        run: |
          python3 - <<'EOF'
          import json, re
          d = json.load(open("server.json"))
          assert 1 <= len(d["description"]) <= 100, f"description is {len(d['description'])} chars; the registry caps it at 100"
          assert re.fullmatch(r"[a-zA-Z0-9.-]+/[a-zA-Z0-9._-]+", d["name"]), d["name"]
          print("server.json ok:", len(d["description"]), "chars")
          EOF
      - name: cli
        working-directory: cli
        run: node --test test/*.test.mjs
