name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./internal ./cmd)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race)
        run: go test -race ./...

      # sdk.js ships to every customer's browser and its env detection decides whether an
      # event counts as production at all. Go tests cannot reach it, so it gets its own runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: sdk env detection
        run: node internal/api/sdktest/env.test.mjs

      - name: cli
        working-directory: cli
        run: node --test test/*.test.mjs
