name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]

# Runs QUEUE, they never cancel each other.
#
# A release here is a push to main followed seconds later by a push of the tag, and both
# trigger this workflow. Without a group they raced; with a cancelling group the tag's run
# died and GitHub mailed "All jobs were cancelled" for a release that was perfectly fine.
# Keyed by ref so main and a tag never share a group, and cancel-in-progress is false because
# a half-published image is worse than a slow one.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=short
            # "stable" = what the hosted product provisions NEW tenant instances from. It moves ONLY
            # on a deliberate v* release tag, never on a main push, so an ordinary commit can never
            # reach a customer's new instance the way :latest would.
            # This exists because the cloud used to hardcode a version here and it silently went
            # stale: new projects were provisioning v0.9.13 while the product shipped v0.12.x, so a
            # new customer would have got an engine missing agent observability and half the
            # dashboard. Cutting a release now updates provisioning by itself, with nothing to
            # remember in the other repo.
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
