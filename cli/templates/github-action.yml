# smolanalytics — end-to-end tests without test code, on every pull request.
#
# Copy this file to .github/workflows/e2e.yml, then do these two things and nothing else:
#   1. add ANTHROPIC_API_KEY to this repository's secrets (Settings → Secrets and variables → Actions).
#      Without it every test comes back "could not run" and the pull request comment says so.
#   2. put your tests in tests/ — one markdown heading is one test, one sentence under it is the
#      whole test. `npx smolanalytics suggest --url <your app>` walks the app and writes a starting
#      set for you; templates/example-test.md in this package is a worked one to copy from.
#
# THERE IS NO STEP 3. You do not have to tell this workflow where your preview is: with no --url,
# inside Actions on a pull request, the CLI asks the GitHub deployments API — with the token this
# job already has — which preview belongs to THIS pull request. Vercel, Netlify and Cloudflare Pages
# all announce theirs that way. If yours does not, uncomment one of the three options below.
#
# That is the whole install. No GitHub App on your repositories, no agent pushing a Dockerfile into
# your code, no environment built before you are allowed to see anything. This runs on your own
# Actions runner, against a URL your host already builds for the pull request, and comments using
# the token Actions hands every job for free.

name: e2e

on:
  pull_request:

  # ON A SCHEDULE INSTEAD, FOR A SITE THAT HAS NO PULL REQUESTS.
  #
  # A WordPress, Webflow, Squarespace or Shopify site is edited in a dashboard, not in git, so
  # `pull_request` never fires and nothing above ever runs. Uncomment this and the same suite runs
  # against the live site every morning, reporting to the job log (and to your project, if the two
  # SMOLANALYTICS_ variables below are set) rather than to a pull request.
  #
  # Set --url explicitly when you do: there is no preview deployment to discover.
  # schedule:
  #   - cron: "0 7 * * *"

# THESE TWO, AND NOTHING ELSE.
#   contents: read        actions/checkout reads tests/ out of this repository.
#   pull-requests: write  the verdict is one comment on the pull request, edited in place on every
#                         push. Without it everything runs and only the comment fails, with a 403.
# Naming them here also takes everything else away: a compromised step in this workflow cannot push
# code, cut a release, or reach another repository.
permissions:
  contents: read
  pull-requests: write

# One run per pull request. Push twice in a minute and two runs drive two browsers against the same
# preview and race to edit the same comment; the older one is not worth reading by then anyway.
concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    # A hung browser otherwise runs to the six-hour default and bills six hours of somebody's
    # minutes for a test that was never going to finish. Raise it if your suite is large enough
    # that a run where every recording woke the agent takes longer than this.
    timeout-minutes: 30

    # WHO DOES NOT GET SECRETS, and would therefore run every test against an empty key and then
    # 403 on the comment. Skipping says that plainly; failing on every one of these is how a new
    # tool gets uninstalled.
    #   a fork's pull request  — no secrets, read-only token
    #   dependabot             — same repository, but Actions withholds repository secrets from it
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ----------------------------------------------------------------------------------------
      # THE PREVIEW URL — ALL THREE OF THESE ARE OFF, AND FOR MOST REPOSITORIES THAT IS CORRECT.
      #
      # Leave them commented and the CLI finds the preview itself: `URL` below resolves to the empty
      # string when no step is called `preview`, an empty --url is the same as no --url, and inside
      # Actions on a pull request the CLI then asks the GitHub deployments API — with the same
      # GITHUB_TOKEN this job already has — which deployment belongs to THIS pull request. It waits
      # up to 4 minutes (--wait-preview <sec> changes that) and prints a line per poll, so the log
      # never looks hung. If no ready deployment turns up it stops with exit 2, says what it looked
      # for, and comments that on the pull request. It never guesses a URL and never falls back to
      # your production domain: a verdict against the wrong deployment is worse than no verdict.
      #
      # Uncomment ONE of these only if that lookup found nothing — a host that does not create
      # GitHub deployments, or an app you have to build here. Each sets the same `preview` step
      # output, so the run step below never changes either way.
      # ----------------------------------------------------------------------------------------

      # (a) A HOST WITH ITS OWN WAIT ACTION. Vercel builds the preview itself; this waits for that
      #     deployment to be ready and reads its URL. Netlify and Render have equivalent actions.
      #     A third-party action inside a job holding `pull-requests: write` is worth a moment's
      #     thought, which is the other reason this is not the default.
      # - name: the preview URL
      #   id: preview
      #   uses: patrickedqvist/wait-for-vercel-preview@v1
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     max_timeout: 600

      # (b) A URL YOU ALREADY HAVE — staging, or a preview at a predictable address.
      # - name: the preview URL
      #   id: preview
      #   run: echo "url=https://staging.example.com" >> "$GITHUB_OUTPUT"

      # (c) BUILD AND SERVE IT HERE, for a static site with no preview host. The server is
      #     backgrounded, so wait for it: a test against a port nothing is listening on yet reports
      #     a broken app when the app is fine.
      # - name: the preview URL
      #   id: preview
      #   run: |
      #     npm ci
      #     npm run build
      #     npx --yes serve --listen 4173 dist &
      #     npx --yes wait-on --timeout 60000 http://localhost:4173
      #     echo "url=http://localhost:4173" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------------------------
      # THE RECORDINGS. These two steps are the economics of the whole tool.
      #
      # A passing run is recorded and replayed with no model calls at all, in about a second on a
      # measured flow. But a CI runner starts empty every time. WITHOUT THIS CACHE every test on
      # every pull request is a fresh agent run: slower, and paid for per run, forever. With it, the
      # agent only wakes when a recording stops fitting the app.
      #
      # The key is per-commit so each run saves a fresh entry, and restore-keys takes the newest
      # earlier one.
      #
      # HOW FAR THE CACHE REACHES, WHICH IS NOT AS FAR AS YOU WOULD LIKE. Actions scopes a cache to
      # the branch that wrote it, and a run may read only its own branch's caches and the default
      # branch's. This workflow runs on `pull_request` and nothing else, so nothing ever writes a
      # cache on the default branch: pull request #2 cannot see what #1 recorded. THE FIRST RUN OF
      # EVERY NEW PULL REQUEST IS A FULL AGENT RUN. Every push after it on that same pull request
      # replays. That is the cost, it is bounded, and it is worth expecting rather than debugging.
      #
      # If you would rather pay it once for the repository: commit .smolanalytics/recordings. They
      # are small JSON, they are meant to be read in review, and a recording that arrives with the
      # code it describes starts every branch warm. Then delete both cache steps.
      #
      # You can watch this working: the pull request comment says how many tests replayed and how
      # many woke the agent, on every run. Within one pull request that number should fall after
      # the first push. Two reasons it legitimately will not, before you suspect these steps: a
      # brand-new pull request starts cold, as above, and a test that passes by only reading a page
      # performs no step, so there is nothing to record and it wakes the agent every time.
      # ----------------------------------------------------------------------------------------
      - name: restore the recordings
        uses: actions/cache/restore@v4
        with:
          path: .smolanalytics/recordings
          key: smolanalytics-recordings-${{ github.sha }}
          restore-keys: |
            smolanalytics-recordings-

      # Chromium is downloaded here each run and deliberately not cached. A Chromium entry is
      # hundreds of megabytes against a repository's 10 GB cache allowance, so a handful of runs
      # would fill it and GitHub would evict the oldest entries — the recordings, which are the
      # part worth keeping and the part that cannot be re-downloaded.
      - name: e2e
        # WEEK ONE: REPORT, DO NOT BLOCK. A new tool that puts a red X on somebody's pull request
        # before it has earned any trust gets uninstalled instead of read. The comment is still
        # posted and the step is still marked failed in the log. Delete this line once the suite has
        # been right often enough that a failure should stop a merge.
        continue-on-error: true
        env:
          # Referenced as "$URL" below rather than interpolated into the script, because a value
          # that came from another action must never be pasted into a shell command.
          #
          # EMPTY BY DEFAULT, AND THAT IS THE ZERO-CONFIG PATH, NOT A BUG: with no step called
          # `preview` this resolves to "", `--url ""` is read as no --url at all, and the CLI goes
          # and asks the deployments API. Leave the line here either way — uncommenting one of the
          # preview options above is then the only edit you have to make.
          URL: ${{ steps.preview.outputs.url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Provided automatically by Actions. This is the whole of the GitHub access this needs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          #
          # OPTIONAL — only if you have a project at smolanalytics.com and want every run's verdict
          # to land on its page. Both come from that project's "setup & keys" screen, and BOTH are
          # needed: with only one set the run still passes and nothing is posted.
          #
          # This file had no slot for either of them while the setup page said "with those two set,
          # every run your suite posts lands on the project page" and pointed here for the full
          # template. Somebody following both ended up with CI that tests and comments correctly and
          # a project page reading "no test runs yet" forever, with nothing anywhere saying why.
          #
          # The variable is named WRITE_KEY because that is what the runner reads; the value is the
          # project's run key (sar_…), which exists from the moment the project does.
          # SMOLANALYTICS_PROJECT: prj_your_project_id
          # SMOLANALYTICS_WRITE_KEY: ${{ secrets.SMOLANALYTICS_WRITE_KEY }}
        run: npx smolanalytics@latest test --suite tests/ --url "$URL" --comment

      # THE EVIDENCE. On a failed (or flaky) test the runner writes a full-page screenshot, the
      # page's visible text and the URL to .smolanalytics/evidence/<test>/ at the moment the test
      # failed. A screenshot on the runner's disk that nobody uploads is NOT evidence — the runner
      # is recycled minutes after the job ends — so it goes up as a workflow artifact, downloadable
      # from the run page the pull request comment links to.
      #
      # `always()`, not the default condition: today continue-on-error marks the failing step green,
      # but the day that line is deleted a default-condition upload would be skipped on exactly the
      # runs that produced evidence. `ignore` because a green run writes no evidence files, and an
      # empty directory is not a warning.
      - name: upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smolanalytics-evidence
          path: .smolanalytics/evidence
          if-no-files-found: ignore

      # SAVED AS ITS OWN STEP, AND `if: always()`.
      #
      # The all-in-one actions/cache saves in a post step declared `post-if: success()`. That is
      # invisible until the day you delete the continue-on-error above — and from that day, a run
      # with one failing test throws away every recording the agent repaired in it. The failing run
      # is the run that re-recorded the most, so the next push pays the agent for all of them again,
      # and the cache quietly stops paying for itself.
      - name: save the recordings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .smolanalytics/recordings
          key: smolanalytics-recordings-${{ github.sha }}

# EXIT CODES, if you gate on this later:
#   0  every test passed. A FLAKY test — failed once, then passed when retried from a clean page —
#      also exits 0: it is reported as a warning in the comment and named in the log, but the retry
#      did verify the behaviour, so it does not gate a merge.
#   1  a test failed — the app did not do what the sentence describes
#   2  this runner could not finish: no browser, no key, no network, or a recording stopped fitting
#      and there was no key to re-check it with. Never your application.
